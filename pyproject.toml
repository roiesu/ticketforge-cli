[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ticketforge-cli"
version = "0.1.0"
description = "Interactive command-line client for TicketForge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "rich>=13.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "responses>=0.25",
]

[project.scripts]
tforge = "tforge.cli:main"

[tool.setuptools]
packages = ["tforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
